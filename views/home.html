<!DOCTYPE html>
<html lang="FR-fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <title>Instagram Data Viewer</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cmds.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <nav class="FlexCenter">
        <div class="brand FlexCenter2">
            <img src="../assets/images/logo.png">
            <h1>𝓘𝓷𝓼𝓽𝓪𝓰𝓻𝓪𝓶
                <br><strong>Data Viewer</strong>
            </h1>
        </div>

        <p id="json-file-count" class="main-p-nav">0 fichier de données</p>
        <div id="divContentJSON">
            <button id="select-model-folder" type="button"><i class="fa-solid fa-folder-plus"></i>Ajouter vos données</button>
        </div>

        <button class="trashData" id="libEspace" type="button" disabled>
            <i class="fa-solid fa-photo-film"></i>
            Libérer de l'espace
            <strong>(<span id="qteGO">0,00</span>)</strong>
        </button>
    </nav>
    <section id="primary-sec" class="FlexCenter">
        <p class="main-p-nav">© 2026 RIBOTE--MORAL Noa</p>
        
        <div id="drop-target" class="FlexCenter">
            <h1><i class="fa-solid fa-folder-open"></i></h1>
        </div>

    </section>
    <div class="Directories_btn FlexCenter2">
        <button id="directory-open"><i class="fa-solid fa-folder"></i></button>
        <button id="archive-zip" disabled><i class="fa-solid fa-file-zipper"></i></button>
    </div>
    <div class="Funcs_btn FlexCenter2">
        <button id="compare-listes" disabled><i class="fa-solid fa-clone"></i></button>
        <button id="pin-file" disabled><i class="fa-solid fa-thumbtack"></i></button>
        <button id="delete-file" disabled><i class="fa-regular fa-trash-can"></i></button>
    </div>
    <div id="cleanup-prompt" class="copy-modal-backdrop" hidden>
        <section class="copy-modal" role="dialog" aria-modal="true" aria-labelledby="cleanup-title">
            <h2 id="cleanup-title">Libérer de l’espace</h2>
            <p id="cleanup-message"></p>
            <progress id="cleanup-progress" max="100" value="0" hidden></progress>
            <p id="cleanup-status" hidden></p>
            <div class="copy-modal-actions">
                <button id="cleanup-yes" type="button">Supprimer</button>
                <button id="cleanup-no" type="button">Annuler</button>
            </div>
        </section>
    </div>
    <div id="copy-modal" class="copy-modal-backdrop" hidden>
        <section class="copy-modal" role="dialog" aria-modal="true" aria-labelledby="copy-modal-title">
            <h2 id="copy-modal-title">Copie des données</h2>
            <p id="copy-estimate">Préparation de l’estimation…</p>
            <progress id="copy-progress" max="100" value="0"></progress>
            <p id="copy-status">Analyse des fichiers…</p>
            <p id="replace-prompt" hidden>Les fichiers existent déjà.<br>Voulez-vous les remplacer ?</p>
            <div id="replace-actions" class="copy-modal-actions" hidden>
                <button id="replace-yes" type="button">Oui</button>
                <button id="replace-no" type="button">Non</button>
            </div>
            <button id="cancel-copy" type="button">Annuler</button>
        </section>
    </div>
</body>
<script src="js/dom.js"></script>
<script src="js/ModelView.js"></script>
<script src="js/ImportView.js"></script>
<script src="js/CleanupView.js"></script>
<script src="../controllers/ModelViewController.js"></script>
<script src="../controllers/ImportViewController.js"></script>
<script src="../controllers/CleanupViewController.js"></script>
<script src="../renderer.js"></script>
</html>
